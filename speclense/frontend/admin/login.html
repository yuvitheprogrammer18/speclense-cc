<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Speclense</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--ink);">

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Speclense Admin</h1>
    <p class="sub">Sign in with an admin account to manage products, orders and customers.</p>
    <div id="form-msg" class="form-msg"></div>
    <form id="admin-login-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="auth-foot"><a href="../index.html">← Back to storefront</a></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const { token, user } = await Api.login({ email, password });
    if (user.role !== 'admin') {
      showMsg(msg, 'This account does not have admin access.');
      return;
    }
    Session.save(token, user);
    window.location.href = 'dashboard.html';
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
