<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Speclense Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-page">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">Speclense<span class="dot">.</span></div>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="orders.html">Orders</a>
    <a href="users.html">Customers</a>
    <a href="../index.html">View storefront</a>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 style="font-size:1.6rem;">Dashboard</h1>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="admin-name" style="font-weight:600;"></span>
        <button id="admin-logout" class="btn btn-outline btn-sm">Log out</button>
      </div>
    </div>

    <div class="stat-grid" id="dash-stats">
      <p>Loading…</p>
    </div>

    <h3 style="margin-bottom:14px;">Low stock</h3>
    <table>
      <thead><tr><th>Product</th><th>Stock</th></tr></thead>
      <tbody id="dash-lowstock"></tbody>
    </table>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
