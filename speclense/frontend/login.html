<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Speclense</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-row">
    <a href="index.html" class="brand">Speclense<span class="dot">.</span></a>
    <nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav>
    <div class="nav-actions">
      <span id="nav-auth-slot"></span>
      <a href="cart.html" class="icon-link">Cart <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to check out faster and track your orders.</p>
    <div id="form-msg" class="form-msg"></div>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
      <div class="field-row">
        <label style="display:flex;align-items:center;gap:6px;font-weight:400;"><input type="checkbox"> Remember me</label>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="auth-foot">New to Speclense? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
