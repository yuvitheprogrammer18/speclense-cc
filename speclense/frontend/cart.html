<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Speclense</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-row">
    <a href="index.html" class="brand">Speclense<span class="dot">.</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div class="nav-actions">
      <span id="nav-auth-slot"></span>
      <a href="cart.html" class="icon-link active">Cart <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="section-head"><h2>Your cart</h2></div>
    <div class="cart-layout">
      <div>
        <div id="cart-list"></div>
        <div id="cart-empty" class="empty-state" style="display:none;">
          <h2>Your cart is empty</h2>
          <p>Browse the shop and add a few frames.</p>
          <a href="shop.html" class="btn btn-primary">Shop frames</a>
        </div>
      </div>
      <div class="summary-card" id="cart-summary" style="display:none;">
        <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span>Free</span></div>
        <div class="summary-row total"><span>Total</span><span id="summary-total">$0.00</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block">Checkout</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container"><div class="footer-bottom"><span>© 2026 Speclense.</span><a href="shop.html">← Continue shopping</a></div></div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
