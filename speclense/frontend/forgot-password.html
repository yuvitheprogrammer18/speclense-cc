<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Speclense</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-row">
    <a href="index.html" class="brand">Speclense<span class="dot">.</span></a>
    <nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav>
    <div class="nav-actions"><span id="nav-auth-slot"></span></div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">Enter the email on your account and we'll send a reset link.</p>
    <div id="form-msg" class="form-msg"></div>
    <form id="forgot-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>
    <div class="auth-foot"><a href="login.html">← Back to log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
