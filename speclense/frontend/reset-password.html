<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Speclense</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-row">
    <a href="index.html" class="brand">Speclense<span class="dot">.</span></a>
    <nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav>
    <div class="nav-actions"><span id="nav-auth-slot"></span></div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="sub">This link is valid for one hour from when it was requested.</p>
    <div id="form-msg" class="form-msg"></div>
    <form id="reset-form">
      <div class="field"><label for="password">New password</label><input type="password" id="password" minlength="6" required></div>
      <div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" minlength="6" required></div>
      <button type="submit" class="btn btn-primary btn-block">Reset password</button>
    </form>
    <div class="auth-foot"><a href="login.html">← Back to log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
